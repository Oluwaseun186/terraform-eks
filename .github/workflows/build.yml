name: Build
on:
  push:
    branches:
      - origin
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarqube:
    name: SonarCloud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Install Latest SonarScanner
        run: |
          # Install the latest version of SonarScanner
          wget https://github.com/SonarSource/sonar-scanner-cli/releases/download/4.8.0.2856/sonar-scanner-4.8.0.2856-linux.zip
          unzip sonar-scanner-4.8.0.2856-linux.zip -d /opt/
          export PATH=$PATH:/opt/sonar-scanner-4.8.0.2856-linux/bin
      
      - name: Run SonarScanner with Java 17
        run: |
          export JAVA_HOME=${{ steps.setup-java.outputs.java-home }}
          export PATH=$JAVA_HOME/bin:$PATH
          sonar-scanner -X

      - name: SonarCloud Scan
        uses: sonarsource/sonarcloud-github-action@v1
        with:
          sonar.projectKey: ${{ secrets.SONAR_PROJECT_KEY }}
          sonar.organization: ${{ secrets.SONAR_ORG }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

