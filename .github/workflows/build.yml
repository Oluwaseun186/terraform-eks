name: Build
on:
  push:
    branches:
      - origin
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarqube:
    name: SonarCloud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for better analysis relevancy

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Run SonarScanner in Docker
        run: |
  
          docker pull sonarsource/sonar-scanner-cli:latest

     
          SONAR_PROJECT_KEY=$(echo "${{ secrets.PROJECT_KEY }}" | tr '[:upper:]' '[:lower:]')
          SONAR_ORG=$(echo "${{ secrets.SONAR_ORG }}" | tr '[:upper:]' '[:lower:]')
          
          # Run SonarScanner inside a container
          docker run --rm \
            -e SONAR_TOKEN=${{ secrets.SONAR_TOKEN }} \
            -e SONAR_PROJECT_KEY=${PROJECT_KEY} \
            -e SONAR_ORG=${SONAR_ORG} \
            -v $PWD:/workspace \
            sonarsource/sonar-scanner-cli \
            sonar-scanner \
            -Dsonar.projectKey=${PROJECT_KEY} \
            -Dsonar.sources=. \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.organization=${SONAR_ORG}



